    <text x="16" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#F3E8FF">Anthropic Claude</text>
    <text x="16" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#C084FC">Opus 5.5 • Sonnet 5 • Haiku 4.5</text>
    <text x="16" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Gold standard reasoning, refactoring &amp; coding</text>

    <!-- Amazon Nova -->
    <rect x="315" y="0" width="300" height="85" rx="8" fill="#130D24" stroke="#4C1D95"/>
    <text x="331" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#F3E8FF">Amazon Nova</text>
    <text x="331" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#C084FC">Nova Pro • Nova Lite • Nova Premier</text>
    <text x="331" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Ultra-low latency, high throughput &amp; cost efficiency</text>

    <!-- Multi-Model & Open Weights -->
    <rect x="630" y="0" width="300" height="85" rx="8" fill="#130D24" stroke="#4C1D95"/>
    <text x="646" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13.5" font-weight="700" fill="#F3E8FF">OpenAI &amp; Open Weights</text>
    <text x="646" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#C084FC">GPT-5.6 • Mistral Large • Llama</text>
    <text x="646" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Zero Data Retention (ZDR) via AWS PrivateLink</text>
  </g>

</svg>
