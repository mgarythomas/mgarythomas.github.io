  <text x="340" y="450" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#FFFFFF">AWS Bedrock AgentCore &amp; Enterprise Gateways</text>

