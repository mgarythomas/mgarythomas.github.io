  </g>
  <!-- Layer 3 Header & Badge -->
  <rect x="95" y="732" width="220" height="24" rx="4" fill="#6B21A8" fill-opacity="0.4" stroke="#C084FC" stroke-width="1"/>
  <text x="205" y="748" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#F3E8FF" letter-spacing="0.5">LAYER 3: FOUNDATION MODELS</text>
  <text x="330" y="750" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="18" fill="#FFFFFF">High-Reasoning Frontier Inference</text>

  <!-- Model Columns -->
  <g transform="translate(95, 774)">
    <!-- Anthropic Claude -->
