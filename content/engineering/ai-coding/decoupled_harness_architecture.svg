  <g transform="translate(95, 474)">
    <!-- Card 1: Runtime -->
    <rect x="0" y="0" width="220" height="130" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="12" y="12" width="70" height="18" rx="3" fill="#064E3B"/>
    <text x="47" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">RUNTIME</text>
    <text x="12" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Isolated MicroVMs</text>
    <text x="12" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Serverless execution of agent code off local laptops in safe cloud sandboxes.</text>

    <!-- Card 2: Memory -->
    <rect x="236" y="0" width="220" height="130" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="248" y="12" width="65" height="18" rx="3" fill="#064E3B"/>
    <text x="280" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">MEMORY</text>
    <text x="248" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Persistent State</text>
    <text x="248" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Multi-turn thread context, task history &amp; architectural knowledge recall.</text>

    <!-- Card 3: Gateway & Identity -->
    <rect x="472" y="0" width="220" height="130" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="484" y="12" width="80" height="18" rx="3" fill="#064E3B"/>
    <text x="524" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">GATEWAY</text>
    <text x="484" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">IAM &amp; Credentials</text>
    <text x="484" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">Fine-grained role binding. Agents only access tools scoped to authenticated identity.</text>

    <!-- Card 4: Policy & Audit -->
    <rect x="708" y="0" width="220" height="130" rx="8" fill="#0F172A" stroke="#334155"/>
    <rect x="720" y="12" width="60" height="18" rx="3" fill="#064E3B"/>
    <text x="750" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" font-weight="700" fill="#34D399">POLICY</text>
    <text x="720" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#F8FAFC">Deterministic Control</text>
    <text x="720" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94A3B8">CloudWatch tracing, guardrails against destructive edits &amp; CPS 234 audit evidence.</text>
  </g>

  <!-- ==================== CONNECTOR 2: CONVERSE API ==================== -->
  <line x1="560" y1="630" x2="560" y2="685" stroke="#C084FC" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 560 682 L 560 688" marker-end="url(#conn_arrow_down_purple)"/>

  <g transform="translate(325, 642)">
    <rect x="0" y="0" width="470" height="34" rx="17" fill="url(#api_badge_grad)" stroke="#D8B4FE" stroke-width="1.5" filter="url(#card_shadow)"/>
    <text x="235" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">BEDROCK CONVERSE API &amp; BEDROCK MANTLE</text>
  </g>
  <text x="560" y="694" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#D8B4FE">Unified Multi-Model Routing • VPC Endpoints • Zero Data Retention (ZDR) • Cross-Region Profiles</text>

  <!-- ==================== LAYER 3: FOUNDATION MODELS ==================== -->
  <g filter="url(#card_shadow)">
