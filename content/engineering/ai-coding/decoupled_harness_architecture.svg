    <text x="210" y="21" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">MODEL CONTEXT PROTOCOL (MCP)</text>
  </g>
  <text x="560" y="394" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" fill="#7DD3FC">Secure Tool Brokerage • Postgres Schemas • Jira / GitLab • Internal APIs • Telemetry</text>

