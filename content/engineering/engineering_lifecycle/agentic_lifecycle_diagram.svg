<title>Agentic engineering lifecycle</title>
<desc>A nine-stage circular lifecycle: specification, architecture and design, task generation, build code, automated tests, SAST, DAST, lean deployment, and operate, all governed by a central GitLab repository with audit trail and compliance.</desc>
